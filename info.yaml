# Tiny Tapeout project information
project:
  title:        "Escapement"      # Project title
  author:       "parthDOOM"       # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable protocol engine with reject-not-late timed I/O (Jane Street protocol emulator competition)"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? Authoritative sizes: tt-support-tools tech/ihp-sg13cmos5l/tile_sizes.yaml.
  # 6x4 = 1289.28 x 710.64 um (current Jane Street competition maximum).
  tiles: "6x4"          # Valid values (tools d66cf17): 1x1 ... 6x4, 8x1, 8x2, 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_escapement"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "escapement_host.v"
    - "escapement_sram.v"
    - "RM_IHPSG13_1P_256x32_c2_bm_bist.v"
    - "esc_core.v"
    - "esc_ctx.v"
    - "esc_cap.v"
    - "esc_greg.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# Host SPI per docs/12-HOST-PROTOCOL.md; protocol pins per docs/11-SEMANTICS.md.
pinout:
  # Inputs
  ui[0]: "HOST_CS_N"
  ui[1]: "HOST_SCK"
  ui[2]: "HOST_MOSI"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "HOST_MISO"
  uo[1]: "IRQ"
  uo[2]: "RUN"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "P0"
  uio[1]: "P1"
  uio[2]: "P2"
  uio[3]: "P3"
  uio[4]: "P4"
  uio[5]: "P5"
  uio[6]: "P6"
  uio[7]: "P7"

# Do not change!
yaml_version: 6
