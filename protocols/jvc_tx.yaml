# JVC infrared remote: a 38 kHz carrier, pulse-distance coding. An 8.4 ms burst and a
# 4.2 ms space, then 16 bits LSB first (8 address bits, 8 command bits), each a 526 us burst
# and a space making the bit 1.05 ms (0) or 2.10 ms (1), and a closing burst.
name: jvc_tx
title: JVC infrared frame with a 38 kHz carrier; one code per host word (address | command << 8), acknowledged
refs: ["SB-Projects, JVC Protocol, www.sbprojects.net/knowledge/ir/jvc.php: 38 kHz carrier, 526 us bursts (20 carrier periods), 0 = 1.05 ms and 1 = 2.10 ms bit times, 8.4 ms AGC burst and 4.2 ms space, 8-bit address then 8-bit command LSB first, repeated every 50 to 60 ms"]
context: 0
pins:
  IR: {pin: 0, idle: 0}
constants:
  PERIOD: (CLK_KHZ * 10 + 190) // 380      # 38 kHz
  T: 20 * PERIOD                           # 526 us, 20 carrier periods
  GAP: CLK_KHZ * 10                        # 10 ms of quiet after a frame (at most 46.8 ms)
carrier: {period: PERIOD, high: (PERIOD + 1) // 3}    # 1/3 duty
symbols:
  agc:  [[{IR: carrier}, 16 * T], [{IR: 0}, 8 * T]]
  zero: [[{IR: carrier}, T], [{IR: 0}, T]]
  one:  [[{IR: carrier}, T], [{IR: 0}, 3 * T]]
  stop: [[{IR: carrier}, T]]
  gap:  [[{IR: 0}, GAP]]
frame: [agc, {bits: 16, order: lsb, choose: [zero, one]}, stop]
source: {kind: mailbox}
packet: {after: [gap], ack: true}
