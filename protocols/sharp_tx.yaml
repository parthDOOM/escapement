# Sharp infrared remote: a 38 kHz carrier, no leader, 15 pulse-distance bits LSB first (5
# address bits, 8 command bits, the expansion bit and the check bit) and a closing burst.
# The frame is sent twice, 40 ms apart, the second with its command, expansion and check
# bits inverted; one host word holds the pair, the first frame in bits 0-14 and the
# second in bits 15-29.
name: sharp_tx
title: Sharp infrared frame pair with a 38 kHz carrier; one host word holds both 15-bit frames (the second inverted), acknowledged
refs: ["SB-Projects, Sharp Protocol, www.sbprojects.net/knowledge/ir/sharp.php: 38 kHz carrier, 320 us bursts, 1 ms (0) and 2 ms (1) bit periods, 5 address bits, 8 command bits, expansion 1, check 0, LSB first; repeated 40 ms later with the command, expansion and check bits inverted"]
context: 0
pins:
  IR: {pin: 0, idle: 0}
constants:
  PERIOD: (CLK_KHZ * 10 + 190) // 380      # 658 ticks at 25 MHz: 37.99 kHz
  NBIT: 12                                 # carrier pulses in a 320 us burst (316 us)
  BIT0: CLK_KHZ                            # 1 ms, burst to burst: 0
  BIT1: CLK_KHZ * 2                        # 2 ms, burst to burst: 1
  GAP: CLK_KHZ * 40                        # 40 ms of quiet after each frame
carrier: {period: PERIOD, high: (PERIOD + 1) // 3}    # 1/3 duty
symbols:
  zero:   [[{IR: carrier}, NBIT * PERIOD], [{IR: 0}, BIT0 - NBIT * PERIOD]]
  one:    [[{IR: carrier}, NBIT * PERIOD], [{IR: 0}, BIT1 - NBIT * PERIOD]]
  stop:   [[{IR: carrier}, NBIT * PERIOD]]
  gap:    [[{IR: 0}, GAP]]
frame: [{bits: 15, order: lsb, choose: [zero, one]}, stop, gap]
source: {kind: mailbox, units_per_word: 2}
packet: {ack: true}
