# Samsung infrared remote (Samsung32): a 38 kHz carrier, a 4.5 ms leader burst and a 4.5 ms
# space, then 32 pulse-distance bits LSB first (the 16-bit custom code, a data byte and its
# complement) and a closing burst.
name: samsung_tx
title: Samsung infrared frame (Samsung32) with a 38 kHz carrier; one raw 32-bit frame per host word, acknowledged
refs: ["Samsung KS51840 remote control transmitter datasheet: carrier fosc/12 (37.9 kHz from 455 kHz), a 4.5 ms leader and a 4.5 ms space, 0.56 ms bursts, 1.12 / 2.25 ms bit periods, a 16-bit custom code, then 8 data bits and their complement, LSB first",
       "Arduino-IRremote, ir_Samsung.hpp: the same figures (4500 / 4500 us header, 560 us marks, 560 / 1690 us spaces)"]
context: 0
pins:
  IR: {pin: 0, idle: 0}
constants:
  PERIOD: (CLK_KHZ * 10 + 190) // 380      # 658 ticks at 25 MHz: 37.99 kHz
  NBIT: 21                                 # carrier pulses in a 0.56 ms bit or stop burst (553 us)
  NLEAD: 171                               # carrier pulses in the 4.5 ms leader (4.50 ms)
  HDR: CLK_KHZ * 9                         # 9 ms, leader start to the first bit
  BIT0: CLK_KHZ * 112 // 100               # 1.12 ms, burst to burst: 0
  BIT1: CLK_KHZ * 225 // 100               # 2.25 ms, burst to burst: 1
  GAP: CLK_KHZ * 40                        # 40 ms of quiet after a frame
carrier: {period: PERIOD, high: (PERIOD + 1) // 3}    # 1/3 duty
symbols:
  leader: [[{IR: carrier}, NLEAD * PERIOD], [{IR: 0}, HDR - NLEAD * PERIOD]]
  zero:   [[{IR: carrier}, NBIT * PERIOD], [{IR: 0}, BIT0 - NBIT * PERIOD]]
  one:    [[{IR: carrier}, NBIT * PERIOD], [{IR: 0}, BIT1 - NBIT * PERIOD]]
  stop:   [[{IR: carrier}, NBIT * PERIOD]]
  gap:    [[{IR: 0}, GAP]]
frame: [leader, {bits: 32, order: lsb, choose: [zero, one]}, stop]
source: {kind: mailbox}
packet: {after: [gap], ack: true}
