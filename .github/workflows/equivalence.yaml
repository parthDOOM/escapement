name: equivalence

# By hand only: the netlist of an earlier harden against the RTL (formal/equiv.sh). Every gds
# run proves the netlist it builds, in its own job (D-69); this is for a change to the proof
# alone, which does not harden again. It takes the newest successful gds run on the branch
# whose commit has the dispatched commit's src/, and fails if there is none.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  equivalence:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The newest successful gds run on the branch whose commit has this commit's src/ (the
      # RTL and the flow configuration). Taking simply the newest finished run proved a stale
      # netlist once: dispatched while the head's gds run was still going, it found the
      # previous commit's run, with different RTL (D-68).
      - name: The gds run of this RTL
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" -w gds -b "${{ github.ref_name }}" -s success -L 30 \
            --json databaseId,headSha -q '.[] | "\(.databaseId) \(.headSha)"' > runs.txt
          while read -r id sha; do
            if git cat-file -e "$sha^{commit}" 2>/dev/null && git diff --quiet "$sha" HEAD -- src; then
              echo "gds run $id (commit $sha) has this commit's src/"
              echo "id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < runs.txt
          echo "no successful gds run on ${{ github.ref_name }} has this commit's src/ yet" >&2
          exit 1

      - name: Netlist from that run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" -n tt_submission -D gds
          find gds -name 'tt_um_escapement.v' -path '*tt_submission*' | head -1 > netlist_path
          test -s netlist_path

      - name: Standard-cell liberty at the pinned PDK commit
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK pdk
          cd pdk
          git sparse-checkout set --no-cone '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/lib/'
          git checkout -q 89d42ee6d2fd9b50b86a1aada6fee6673c3e6008

      - uses: ./.github/actions/oss-cad-suite

      - name: Equivalence
        run: |
          set -o pipefail
          PDK_ROOT="$PWD/pdk" bash formal/equiv.sh "$(cat netlist_path)" 2>&1 | tee equiv.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: equivalence-logs
          path: |
            equiv.log
            formal/equiv_build/*.log
