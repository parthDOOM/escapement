name: equivalence

# After every successful gds run on master, the gate-level netlist it produced is proved
# sequentially equivalent to the RTL of the same commit (formal/equiv.sh). The result goes
# to the results page on the site. Run by hand (workflow_dispatch), it takes the newest
# successful gds run on the branch whose RTL is the dispatched commit's, so a branch's
# netlist can be proved before it is merged; it fails if there is none yet.

on:
  workflow_run:
    workflows: [gds]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  equivalence:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # By hand, the newest successful gds run on the branch whose commit has this commit's
      # src/ (the RTL and the flow configuration), so a change to the proof itself can be
      # run against the netlist it is about. Taking simply the newest finished run proved a
      # stale netlist once: dispatched while the head's gds run was still going, it found
      # the previous commit's run, with different RTL.
      - name: The gds run of this RTL
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_run ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            gh run list -R "$GITHUB_REPOSITORY" -w gds -b "${{ github.ref_name }}" -s success -L 30 \
              --json databaseId,headSha -q '.[] | "\(.databaseId) \(.headSha)"' > runs.txt
            while read -r id sha; do
              if git cat-file -e "$sha^{commit}" 2>/dev/null && git diff --quiet "$sha" HEAD -- src; then
                echo "gds run $id (commit $sha) has this commit's src/"
                echo "id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < runs.txt
            echo "no successful gds run on ${{ github.ref_name }} has this commit's src/ yet" >&2
            exit 1
          fi

      - name: Netlist from that run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" -R "$GITHUB_REPOSITORY" -n tt_submission -D gds
          find gds -name 'tt_um_escapement.v' -path '*tt_submission*' | head -1 > netlist_path
          test -s netlist_path

      - name: Standard-cell liberty at the pinned PDK commit
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK pdk
          cd pdk
          git sparse-checkout set --no-cone '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/lib/'
          git checkout -q 89d42ee6d2fd9b50b86a1aada6fee6673c3e6008

      - uses: ./.github/actions/oss-cad-suite

      - name: Equivalence
        run: |
          set -o pipefail
          PDK_ROOT="$PWD/pdk" bash formal/equiv.sh "$(cat netlist_path)" 2>&1 | tee equiv.log

      - name: Summary
        if: always()
        run: python3 scripts/ci_summary.py results/summary.json equiv equiv.log

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary-equivalence
          path: results/summary.json

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: equivalence-logs
          path: |
            equiv.log
            formal/equiv_build/*.log
