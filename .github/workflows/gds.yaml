name: gds

# Pinned to the exact revisions in scripts/versions.txt (docs/05-TOOLCHAIN.md).
# The ttihp27a shuttle's release (v2.0 on): tt-gds-action tag ttihp27a = e7a50f8, which installs
# LibreLane 3.1.0.dev4 for ihp-sg13cmos5l (given explicitly below) and whose precheck and GL test
# use IHP-Open-PDK 89d42ee; tt-support-tools 0922544 (the action's default, main, pinned; v3.0: 9d13ff3).
# v1.2-v1.6 were signed off on the pre-release pins (action 3412659, tools d66cf17, LibreLane
# 3.1.0.dev3, PDK 2bbec755): docs/05-TOOLCHAIN.md.
# The template's `viewer` job (GDS viewer on GitHub Pages) is not used.
#
# One job (D-69): the harden, then on the same runner the precheck, the gate-level test and the
# netlist's equivalence with the RTL (formal/equiv.sh). As separate jobs they were queued when
# the harden ended, behind whatever the mutation campaign had queued by then, and waited hours
# for a runner; here they start the moment the netlist exists, and the netlist proved is the
# one this job built, on every branch. Each runs even if another of the three fails, so one
# failure does not hide the others; the job fails if any does. A change to the proof alone
# (formal/equiv.sh) does not harden again: equivalence.yaml, run by hand, proves the netlist
# of an earlier harden.

on:
  push:
    branches: ['**']        # not on tags: a release tag reruns nothing
    # Harden only when something that affects the GDS or the GL test changes
    # (a harden takes hours; docs/03-PHYSICAL-DESIGN.md).
    paths:
      - 'src/**'
      - 'macro/**'
      - 'info.yaml'
      - 'test/Makefile'
      - 'test/tb.v'
      - 'test/test.py'
      - '.github/workflows/gds.yaml'
      - 'scripts/gds_retry.sh'
  workflow_dispatch:

# a newer push to a branch replaces that branch's run; on master every run completes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write        # a retry deletes the crashed attempt's GDS_logs artifact (D-72)
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Up to three attempts (D-72). OpenROAD's timing-driven global placement can crash on
      # the very input it placed in another run (#11977, docs/24-TOOL-BUGS.md), so a crash
      # there (Signal 11 or RSZ-1008) builds again; any other failure is not retried. Before a
      # retry the crashed attempt's logs are kept as GDS_logs_attempt<n>, and its GDS_logs
      # artifact, which the action would fail to upload a second time, is deleted. The step
      # named "Build GDS" passes only if an attempt did, and the steps after it check it.
      - name: Build GDS, attempt 1
        id: build1
        continue-on-error: true
        uses: TinyTapeout/tt-gds-action@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6
        with:
          pdk: ihp-sg13cmos5l
          tools-ref: 0922544e6c7f6126047c3fba720b0437fa32a1b8
          librelane-version: 3.1.0.dev4

      - name: Placement crash after attempt 1?
        id: retry1
        if: ${{ !cancelled() && steps.build1.outcome == 'failure' }}
        run: bash scripts/gds_retry.sh check

      - name: Keep attempt 1's logs
        if: ${{ !cancelled() && steps.retry1.outputs.retry == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: GDS_logs_attempt1
          path: runs/wokwi/*

      - name: Clear attempt 1
        if: ${{ !cancelled() && steps.retry1.outputs.retry == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gds_retry.sh clean

      - name: Build GDS, attempt 2
        id: build2
        if: ${{ !cancelled() && steps.retry1.outputs.retry == 'true' }}
        continue-on-error: true
        uses: TinyTapeout/tt-gds-action@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6
        with:
          pdk: ihp-sg13cmos5l
          tools-ref: 0922544e6c7f6126047c3fba720b0437fa32a1b8
          librelane-version: 3.1.0.dev4

      - name: Placement crash after attempt 2?
        id: retry2
        if: ${{ !cancelled() && steps.build2.outcome == 'failure' }}
        run: bash scripts/gds_retry.sh check

      - name: Keep attempt 2's logs
        if: ${{ !cancelled() && steps.retry2.outputs.retry == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: GDS_logs_attempt2
          path: runs/wokwi/*

      - name: Clear attempt 2
        if: ${{ !cancelled() && steps.retry2.outputs.retry == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gds_retry.sh clean

      - name: Build GDS, attempt 3
        id: build3
        if: ${{ !cancelled() && steps.retry2.outputs.retry == 'true' }}
        continue-on-error: true
        uses: TinyTapeout/tt-gds-action@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6
        with:
          pdk: ihp-sg13cmos5l
          tools-ref: 0922544e6c7f6126047c3fba720b0437fa32a1b8
          librelane-version: 3.1.0.dev4

      - name: Build GDS
        id: build
        if: ${{ !cancelled() }}
        run: |
          for o in "${{ steps.build1.outcome }}" "${{ steps.build2.outcome }}" "${{ steps.build3.outcome }}"; do
            if [ "$o" = success ]; then echo "GDS built ($o)"; exit 0; fi
          done
          echo "No attempt built the GDS: ${{ steps.build1.outcome }} / ${{ steps.build2.outcome }} / ${{ steps.build3.outcome }}"
          exit 1

      - name: Precheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: TinyTapeout/tt-gds-action/precheck@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6
        with:
          tools-ref: 0922544e6c7f6126047c3fba720b0437fa32a1b8

      - name: GL test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: TinyTapeout/tt-gds-action/gl_test@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6

      - name: Standard-cell liberty at the pinned PDK commit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK equiv-pdk
          cd equiv-pdk
          git sparse-checkout set --no-cone '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/lib/'
          git checkout -q 89d42ee6d2fd9b50b86a1aada6fee6673c3e6008

      # yosys and ABC only, so the suite's Python does not shadow the job's
      - uses: ./.github/actions/oss-cad-suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          tools: yosys yosys-abc

      - name: Equivalence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          NET=$(find tt_submission -name 'tt_um_escapement.v' | head -1)
          test -n "$NET"
          PDK_ROOT="$PWD/equiv-pdk" bash formal/equiv.sh "$NET" 2>&1 | tee equiv.log

      - name: Results page summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/ci_summary.py results/summary.json equiv equiv.log

      - name: Upload results page summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary-equivalence
          path: results/summary.json

      - name: Upload equivalence logs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: equivalence-logs
          path: |
            equiv.log
            formal/equiv_build/*.log
