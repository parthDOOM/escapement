name: test
on:
  push:
    branches: ['**']        # not on tags: a release tag reruns nothing
  workflow_dispatch:

# a newer push to a branch replaces that branch's run; on master every run completes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Does this push change anything but documentation (D-71)? On master every push runs both
  # jobs, since the site is built when master's last verification run finishes (D-69) and a
  # docs-only commit must still reach it. On any other branch a push that changes only files
  # under docs/ or paper/, or Markdown files, skips them. A new branch, a manual run, or a
  # push GitHub cannot compare runs everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" != refs/heads/master ] \
             && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
                         --jq 'if (.files | length) >= 300 then "MANY" else .files[].filename end'); then
              other=$(printf '%s\n' "$files" | grep -vE '^(docs|paper)/|\.md$' | grep -c . || true)
              if [ -n "$files" ] && [ "$other" = 0 ]; then run=false; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "changes: run=$run" | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check results.xml for a failed
          # or errored test case (cocotb 2.1 writes failures="0" on a pass: match the element)
          ! grep -qE '<(failure|error)' results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Results page summary
        if: always()
        run: python3 scripts/ci_summary.py results/summary.json junit "Chip tests on the RTL" test/results.xml

      - name: Upload results page summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary-test
          path: results/summary.json

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  # Everything else that needs no PDK: assembler, ISS, certificate checker, bus models
  # and the bring-up script (sw-test), a timing certificate for every firmware (cert),
  # ISS vs RTL lockstep co-simulation (cosim-parallel) and the newer firmware through
  # the chip's pins (pin-test), then cosim and the line unit on the standard cells.
  verification:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - uses: ./.github/actions/iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt pytest-xdist==3.8.0

      # esclearn's decodes of the sigrok-dumps recordings beside sigrok's own decoders; the
      # outside judges also use Wireshark's tshark, rtl_433, and decoders sigrok-cli 0.7.2 does
      # not ship (libsigrokdecode's newer tree, a community DCC decoder, rc-switch), each
      # fetched at a pinned commit by test/cosim/outside_decoders.sh
      - name: Install sigrok-cli and the outside judges' tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sigrok-cli tshark rtl-433 \
            g++ libglib2.0-dev python3-dev
          bash test/cosim/outside_decoders.sh

      # the README's first command, as a newcomer runs it (sigrok-cli is installed above)
      - name: Quickstart
        run: make quickstart

      - name: Software tests
        run: |
          mkdir -p results
          make sw-test PYTEST_ARGS="--junitxml=$PWD/results/sw.xml"

      - name: Timing certificates
        run: |
          set -o pipefail
          make cert | tee results/cert.log

      - name: Co-simulation
        run: COSIM_PROOF_OUT=$PWD/results/proof_rtl.jsonl make cosim-parallel JOBS=4

      - name: Certificates against measurements
        run: |
          set -o pipefail
          make proof-table RTL=$PWD/results/proof_rtl.jsonl | tee results/proof.md

      # sigrok's decoders, written by other people, read the pins of every case that has one;
      # each judge has a control (one pulse inverted) that must fail it
      - name: Outside judges
        run: |
          set -o pipefail
          make judges JOBS=4 | tee results/judges.md

      # every case again with its pins delayed 1 to 3 ticks each way (pads and board)
      - name: Pad and board timing
        run: |
          set -o pipefail
          make pad-audit JOBS=4 | tee results/pads.md

      - name: Firmware through the chip pins
        run: |
          make pin-test
          ! grep -qE '<(failure|error)' test/results_pins.xml

      # v1.4 (D-40): the clock gates and latch banks exist only in the standard-cell build,
      # so the lockstep co-simulation and the line unit run once more on the PDK's cell models
      - name: Standard-cell models at the pinned PDK commit
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK pdk
          cd pdk
          git sparse-checkout set --no-cone '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog/'
          git checkout -q 89d42ee6d2fd9b50b86a1aada6fee6673c3e6008

      - name: Co-simulation and line unit on the standard cells
        env:
          PDK_ROOT: ${{ github.workspace }}/pdk
          CELLS: 'yes'
        run: |
          make cosim-parallel JOBS=4
          make line-test JOBS=4

      - name: Results page summary
        if: always()
        run: |
          S=results/summary.json
          python3 scripts/ci_summary.py $S junit "Software tests" results/sw.xml
          python3 scripts/ci_summary.py $S cert results/cert.log
          python3 scripts/ci_summary.py $S junit "RTL against the model, lockstep" test/cosim/results_*.xml
          python3 scripts/ci_summary.py $S junit "Firmware through the chip pins" test/results_pins.xml

      - name: Upload results page summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary-verification
          path: results/summary.json
