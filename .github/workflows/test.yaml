name: test
on:
  push:
    branches: ['**']        # not on tags: a release tag reruns nothing
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Results page summary
        if: always()
        run: python3 scripts/ci_summary.py results/summary.json junit "Chip tests on the RTL" test/results.xml

      - name: Upload results page summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary-test
          path: results/summary.json

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  # Everything else that needs no PDK: assembler, ISS, certificate checker, bus models
  # and the bring-up script (sw-test), a timing certificate for every firmware (cert),
  # ISS vs RTL lockstep co-simulation (cosim-parallel) and the newer firmware through
  # the chip's pins (pin-test), then cosim and the line unit on the standard cells.
  verification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - uses: ./.github/actions/iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt pytest-xdist==3.8.0

      - name: Software tests
        run: |
          mkdir -p results
          make sw-test PYTEST_ARGS="--junitxml=$PWD/results/sw.xml"

      - name: Timing certificates
        run: |
          set -o pipefail
          make cert | tee results/cert.log

      - name: Co-simulation
        run: COSIM_PROOF_OUT=$PWD/results/proof_rtl.jsonl make cosim-parallel JOBS=4

      - name: Certificates against measurements
        run: |
          set -o pipefail
          make proof-table RTL=$PWD/results/proof_rtl.jsonl | tee results/proof.md

      - name: Firmware through the chip pins
        run: |
          make pin-test
          ! grep failure test/results_pins.xml

      # v1.4 (D-40): the clock gates and latch banks exist only in the standard-cell build,
      # so the lockstep co-simulation and the line unit run once more on the PDK's cell models
      - name: Standard-cell models at the pinned PDK commit
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK pdk
          cd pdk
          git sparse-checkout set --no-cone '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog/'
          git checkout -q 2bbec755dc67ca3db0261c3d6163e15735d66710

      - name: Co-simulation and line unit on the standard cells
        env:
          PDK_ROOT: ${{ github.workspace }}/pdk
          CELLS: 'yes'
        run: |
          make cosim-parallel JOBS=4
          make line-test JOBS=4

      - name: Results page summary
        if: always()
        run: |
          S=results/summary.json
          python3 scripts/ci_summary.py $S junit "Software tests" results/sw.xml
          python3 scripts/ci_summary.py $S cert results/cert.log
          python3 scripts/ci_summary.py $S junit "RTL against the model, lockstep" test/cosim/results_*.xml
          python3 scripts/ci_summary.py $S junit "Firmware through the chip pins" test/results_pins.xml

      - name: Upload results page summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary-verification
          path: results/summary.json
