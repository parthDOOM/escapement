name: mutation

# The mutation campaign (test/mutation/run_mutants.py): every curated and generated RTL
# mutant against the test suites that can see it, in 40 shards dealt by cost (each
# mutant's time in CI, test/mutation/costs.json); a mutant no test kills is checked formally
# against the original RTL. The canaries (each suite catches a fault it must, the proof says
# both yes and no) run once, beside the shards, and the summary requires them. The suites
# simulate the RTL with the standard-cell clock gates and latch banks (CELLS=yes, D-40), as
# hardened, so a mutant of a latch bank's input reaches them. The cosim suite runs v1.6's
# 43 bus-model cases and v3's 4 (MUTATION_COSIM_CASES): fw-g4's firmware tripled its time.
# The result goes to the results page.
#
# D-69: the plan job (.github/actions/campaign-plan) queues the shards just after the gates
# (docs, test, formal, gds), so the gates take runners first and the shards fill every
# runner left. A commit that already passed here (on its branch, then fast-forwarded to
# master) is not run again.

on:
  push:
    branches: ['**']        # not on tags: a release tag reruns nothing
    paths:
      - 'src/**'
      - 'test/**'
      # the firmware mutants and the outside judges feed no RTL suite (fw-mutants.yaml and
      # the test workflow run them)
      - '!test/mutation/fw_mutants.py'
      - '!test/cosim/judges.py'
      - '!test/cosim/outside_decoders.sh'
      - '!test/cosim/rcswitch_rx.cpp'
      - '!test/cosim/wiringPi.h'
      - 'sw/esciss/**'
      - 'sw/escasm/**'
      - 'formal/equiv.sh'
      - '.github/workflows/mutation.yaml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# a newer push to a branch replaces that branch's run; on master every run completes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  # 40: with 16, runners up to 2x slower than others ran 8 shards past the 355-minute limit
  # (11-13, run 43387544767); with 32 dealt by v2's times, two v3 shards did (11-15, run
  # 43726637327). costs.json holds that run's times: about 2.2 h a shard. More shards would
  # not end sooner: each first runs a 40-minute baseline of the suites (D-69)
  SHARDS: 40

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
      - id: plan
        uses: ./.github/actions/campaign-plan
        with:
          shards: ${{ env.SHARDS }}
          summary: ci-summary-mutation

  shard:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355     # GitHub's limit is 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      # yosys and ABC only, for the equivalence check of survivors; the simulator is
      # Icarus Verilog 13, as in the test workflow's verification job
      - uses: ./.github/actions/oss-cad-suite
        with:
          tools: yosys yosys-abc

      - uses: ./.github/actions/iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Standard-cell liberty and models at the pinned PDK commit
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK pdk
          cd pdk
          git sparse-checkout set --no-cone '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/lib/' \
            '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog/'
          git checkout -q 89d42ee6d2fd9b50b86a1aada6fee6673c3e6008

      - name: Mutants
        env:
          PDK_ROOT: ${{ github.workspace }}/pdk
          EQUIV_LIMIT: '1800'
          CELLS: 'yes'
        run: |
          mkdir -p results
          python test/mutation/run_mutants.py --shard ${{ matrix.shard }}/$SHARDS --jobs 4 --no-canary \
            --json results/mutation-${{ matrix.shard }}.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: results/mutation-${{ matrix.shard }}.json

  canaries:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - uses: ./.github/actions/oss-cad-suite
        with:
          tools: yosys yosys-abc

      - uses: ./.github/actions/iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Standard-cell liberty and models at the pinned PDK commit
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/IHP-GmbH/IHP-Open-PDK pdk
          cd pdk
          git sparse-checkout set --no-cone '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/lib/' \
            '/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/verilog/'
          git checkout -q 89d42ee6d2fd9b50b86a1aada6fee6673c3e6008

      - name: Baseline and canaries
        env:
          PDK_ROOT: ${{ github.workspace }}/pdk
          EQUIV_LIMIT: '1800'
          CELLS: 'yes'
        run: python test/mutation/run_mutants.py --canaries-only --jobs 4

  summary:
    needs: [plan, shard, canaries]
    # failed shards still report; a cancelled run, or one the plan skipped, does not
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Shard results
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: shards
          merge-multiple: true

      - name: Merge
        run: |
          python3 - <<'EOF'
          import glob, json
          from collections import Counter
          res = []
          for f in sorted(glob.glob("shards/mutation-*.json")):
              res += json.load(open(f))["results"]
          counts = Counter(r["result"] for r in res)
          json.dump({"counts": dict(counts), "shards": len(glob.glob("shards/mutation-*.json")), "results": res},
                    open("mutation.json", "w"), indent=1)
          print(dict(counts))
          for r in res:
              if r["result"] in ("SURVIVED", "BADPATCH", "COMPILE-ERROR"):
                  print(r["result"], r["id"], r["desc"])
          EOF

      - name: Results page summary
        run: python3 scripts/ci_summary.py results/summary.json mutation mutation.json

      - name: Upload results page summary
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary-mutation
          path: results/summary.json

      - name: Upload merged results
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results
          path: mutation.json

      - name: The canaries passed
        run: test "${{ needs.canaries.result }}" = success

      - name: Every mutant has exactly one result, killed, proved equivalent or argued
        run: |
          python3 -c "import json; [print(json.dumps(r)) for r in json.load(open('mutation.json'))['results']]" > all.jsonl
          python3 test/mutation/run_mutants.py --reconcile --progress all.jsonl

      - name: Every mutant killed or proved equivalent
        run: |
          python3 -c "import json,sys; c=json.load(open('mutation.json'))['counts']; \
            sys.exit(1 if c.get('SURVIVED',0) or c.get('BADPATCH',0) or c.get('COMPILE-ERROR',0) or \
            json.load(open('mutation.json'))['shards'] != $SHARDS else 0)"
