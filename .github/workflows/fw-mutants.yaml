name: fw-mutants

# The firmware mutation campaign (test/mutation/fw_mutants.py, make fw-mutants): timing bugs
# planted in every shipped program, one per mutant; escert must refute every one that can
# fault, and a mutant it certifies is attacked on the ISS (random inputs, then the program's
# own co-simulation benches): a fault there is UNSOUND and fails the run. On a laptop the
# whole campaign takes over a day, so it runs here in 24 shards, every 24th mutant each;
# the summary merges them into the table docs/04-VERIFICATION.md reports. As in mutation.yaml
# (D-69), a plan job queues the shards just after the gates, and a commit that already passed
# here is not run again.

on:
  push:
    branches: ['**']        # not on tags: a release tag reruns nothing
    paths:
      - 'firmware/**'
      - 'sw/escert/**'
      - 'sw/esciss/**'
      - 'sw/escasm/**'
      - 'sw/escmodels/**'
      - 'test/mutation/fw_mutants.py'
      - 'test/cosim/fw_cases.py'
      - '.github/workflows/fw-mutants.yaml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# a newer push to a branch replaces that branch's run; on master every run completes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  SHARDS: 24

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
      - id: plan
        uses: ./.github/actions/campaign-plan
        with:
          shards: ${{ env.SHARDS }}
          summary: ci-summary-fw-mutants

  shard:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355     # GitHub's limit is 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Mutants
        run: |
          mkdir -p results
          python test/mutation/fw_mutants.py --jobs 4 --shard ${{ matrix.shard }}/$SHARDS \
            --json results/fw-mutants-${{ matrix.shard }}.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fw-mutants-shard-${{ matrix.shard }}
          path: results/fw-mutants-${{ matrix.shard }}.json

  summary:
    needs: [plan, shard]
    # failed shards still report; a cancelled run, or one the plan skipped, does not
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Shard results
        uses: actions/download-artifact@v4
        with:
          pattern: fw-mutants-shard-*
          path: shards
          merge-multiple: true

      # the table, every NOT_PROVEN and UNSOUND mutant; fails on an UNSOUND one, or if a
      # shard did not report
      - name: Merge
        run: |
          set -o pipefail
          test "$(ls shards/fw-mutants-*.json | wc -l)" = "$SHARDS"
          python test/mutation/fw_mutants.py --merge shards/fw-mutants-*.json --json fw-mutants.json \
            | tee fw-mutants.md
          cat fw-mutants.md >> "$GITHUB_STEP_SUMMARY"

      - name: Results page summary
        if: always()
        run: python3 scripts/ci_summary.py results/summary.json fw-mutants fw-mutants.json

      - name: Upload results page summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-summary-fw-mutants
          path: results/summary.json

      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fw-mutants-results
          path: |
            fw-mutants.md
            fw-mutants.json
